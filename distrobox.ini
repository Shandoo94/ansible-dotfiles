[dotfiles-env]
image=archlinux:latest
pull=true
init=true
nvidia=false
root=false

additional_packages="zsh eza fzf zoxide python ansible git git-lfs"
additional_volumes="/run/systemd:/run/systemd:ro /etc/systemd:/etc/systemd:ro /usr/lib/systemd:/usr/lib/systemd:ro /run/user:/run/user:ro"

pre_init_hooks=pacman -Syu --noconfirm

entry=true
start_now=false
