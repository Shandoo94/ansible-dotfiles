- name: Render template configurations
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ dunst_source_dir }}/{{ item }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  loop:
    - dunstrc
  tags: [dunst, config]

- name: Enable Dunst
  ansible.builtin.systemd_service:
    name: dunst.service
    enabled: true
    state: restarted
  tags: [dunst, systemd]
