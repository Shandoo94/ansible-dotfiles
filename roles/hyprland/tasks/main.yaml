- name: Render template configurations
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ hyprland_source_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  loop:
    - hypridle.conf
    - hyprland.conf
    - hyprlock.conf
  tags: [hyprland, config]
